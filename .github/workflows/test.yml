name: test

on:
  push: 
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: setup node.js
      uses: actions/setup-node@v4
      with: 
        node-version: '24'   

    - name: install dependencies
      run: npm install --legacy-peer-deps

    - name: Run wdio
      run: npm run wdio 
      continue-on-error: true   




